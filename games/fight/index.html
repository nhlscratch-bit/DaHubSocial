<meta charset="utf-8"><title>DAHUB Fighters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade. Canvas keeps 16:9; touch controls sit under it in portrait and over it in landscape. Single dark look by choice. */
:root{--bg:#05070b;--fg:#f2f7fa;--dim:#8ea3b3;--cyan:#19e0f0;--gold:#ffcc33;--red:#ff3b5c;--display:"Bungee","Impact","Arial Black",sans-serif;--body:"Chakra Petch","Segoe UI",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:8px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));box-sizing:border-box}
#stage{position:relative;width:min(100%,calc((100vh - 16px) * 16 / 9));aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #1b2a38,0 20px 50px #000}
canvas{display:block;width:100%;height:100%}
#cut{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:7}
#skip{position:absolute;right:10px;bottom:10px;z-index:8;font:400 13px var(--display);color:#fff;background:#000a;border:1px solid #ffffff55;border-radius:6px;padding:7px 12px;cursor:pointer}
#hudbtns{position:absolute;bottom:6px;right:8px;display:flex;gap:6px;z-index:5}
#hudbtns button{font:700 12px var(--body);color:var(--fg);background:#0009;border:1px solid #ffffff33;border-radius:6px;padding:5px 9px;cursor:pointer}
#pad{display:none;width:100%;max-width:640px;justify-content:space-between;align-items:center;gap:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
.coarse #pad{display:flex}
#stick{position:relative;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,#ffffff10,#ffffff05);border:2px solid #ffffff22;flex:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a5566,#0d1a24);border:2px solid var(--cyan);box-shadow:0 0 12px #19e0f066}
#btns{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:64px 64px;gap:10px}
#btns button{border-radius:50%;border:2px solid #ffffff44;font:400 12px var(--display);color:#fff;background:radial-gradient(circle at 35% 30%,#3b4b58,#10171e);box-shadow:0 4px 0 #000;touch-action:none}
#btns button.down{transform:translateY(3px);box-shadow:0 1px 0 #000}
#b-light{border-color:#7ff8ff!important}#b-heavy{border-color:#ffcc33!important}#b-grab{border-color:#ff7a3c!important}#b-block{border-color:#8ea3b3!important}
#b-blazin{grid-column:2/4;border-radius:32px!important;font-size:15px!important;background:linear-gradient(180deg,#5a1020,#200308)!important;border-color:#ff3b5c!important;opacity:.45}
#b-blazin.ready{opacity:1;animation:bz .7s ease-in-out infinite alternate;background:linear-gradient(180deg,#ff3b5c,#8a0f22)!important}
@keyframes bz{to{box-shadow:0 0 18px #ff3b5c,0 4px 0 #000}}
.coarse.landscape #app{padding:0}
.coarse.landscape #stage{width:100%;height:100%;max-width:none;aspect-ratio:auto;border-radius:0}
.coarse.landscape #pad{position:fixed;left:0;right:0;bottom:0;max-width:none;padding:0 max(18px,env(safe-area-inset-right,0px)) max(14px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-sizing:border-box;pointer-events:none;z-index:6}
.coarse.landscape #pad>*{pointer-events:auto;opacity:.82}
.coarse.landscape #hudbtns{bottom:auto;top:58px;right:auto;left:50%;transform:translateX(-50%)}
.coarse.landscape #stick{width:118px;height:118px}
.coarse.landscape #btns{grid-template-columns:repeat(3,56px);grid-template-rows:56px 56px}
#keys{color:var(--dim);font-size:12.5px;text-align:center}
.coarse #keys{display:none}
#keys b{color:var(--fg);font-weight:700}
@media (prefers-reduced-motion:reduce){#b-blazin.ready{animation:none}}
</style>

<div id="app">
  <div id="stage"><canvas id="cv" aria-label="DAHUB Fighters game"></canvas>
    <video id="cut" playsinline preload="auto" hidden></video><button id="skip" type="button" hidden>Skip ›</button>
    <div id="hudbtns"><button id="mute" type="button">Sound on</button><button id="pause" type="button" hidden>Pause</button></div></div>
  <div id="pad" aria-label="Touch controls">
    <div id="stick"><div id="knob"></div></div>
    <div id="btns">
      <button id="b-light" type="button">JAB</button><button id="b-heavy" type="button">BAG</button><button id="b-grab" type="button">GRAB</button>
      <button id="b-block" type="button">BLOCK</button><button id="b-blazin" type="button">BLAZIN’</button>
    </div>
  </div>
  <div id="keys"><b>WASD / arrows</b> move (up and down sidestep) · <b>J</b> light · <b>K</b> heavy · <b>L</b> grab · <b>Space</b> block · <b>U</b> Blazin’ · <b>Enter</b> start · <b>P</b> pause</div>
</div>

<script>
// Asset resolver: inside DAHUB the Arcade passes signed URLs in window.__ASSETS; standalone it falls back to relative paths.
const A = p => (window.__ASSETS && window.__ASSETS[p]) || p
const ROSTER = {
 kenndogg:{ id:'kenndogg', name:'KENNDOGG', title:'STRAIGHT SAVAGE · STREET', pre:'kd', spr:{"idle": {"w": 339, "h": 640, "ax": 159, "ay": 639}, "walk": {"w": 399, "h": 657, "ax": 185, "ay": 656}, "walk_b": {"w": 393, "h": 655, "ax": 183, "ay": 654}, "light": {"w": 434, "h": 612, "ax": 215, "ay": 611}, "heavy": {"w": 396, "h": 600, "ax": 214, "ay": 599}, "grab": {"w": 418, "h": 428, "ax": 226, "ay": 427}, "hit": {"w": 492, "h": 523, "ax": 270, "ay": 522}, "down": {"w": 623, "h": 288, "ax": 324, "ay": 287}, "win": {"w": 369, "h": 598, "ax": 182, "ay": 597}, "gun": {"w": 526, "h": 557, "ax": 140, "ay": 556}}, stage:'alley', stageName:'Baltimore Alley', taunt:'“What you say bout my mama?”', blazin:'THE TAPE', kind:'shot', cut:'video/tape_shot1.mp4', win:'video/tape_win.mp4', labels:['JAB','BAG','GRAB'], heavyName:'bag smash', spd:1, pow:1, col:'#19e0f0' },
 mabel:{ id:'mabel', name:'MABEL', title:'THE FIXER · WRESTLING', pre:'mb', spr:{"idle": {"w": 531, "h": 590, "ax": 269, "ay": 589}, "walk": {"w": 467, "h": 591, "ax": 204, "ay": 590}, "walk_b": {"w": 445, "h": 594, "ax": 211, "ay": 593}, "light": {"w": 532, "h": 593, "ax": 245, "ay": 592}, "heavy": {"w": 527, "h": 593, "ax": 267, "ay": 592}, "grab": {"w": 554, "h": 591, "ax": 274, "ay": 590}, "hit": {"w": 551, "h": 583, "ax": 204, "ay": 582}, "down": {"w": 655, "h": 348, "ax": 312, "ay": 347}, "win": {"w": 490, "h": 591, "ax": 239, "ay": 590}}, stage:'lot', stageName:'Parking Lot', taunt:'“Baby, sit DOWN.”', blazin:'PISTOL WHIP', kind:'whip', cut:'video/whip_cut.mp4', win:'video/whip_win.mp4', labels:['PUSH','WHIP','SLAM'], heavyName:'pistol whip', spd:0.84, pow:1.18, col:'#ff7a3c' },
 freshprince:{ id:'freshprince', name:'FRESH PRINCE', title:'BEL-AIR KID · STREET', pre:'fp', spr:{"idle": {"w": 335, "h": 652, "ax": 154, "ay": 651}, "walk": {"w": 422, "h": 637, "ax": 210, "ay": 636}, "walk_b": {"w": 444, "h": 638, "ax": 218, "ay": 637}, "light": {"w": 541, "h": 638, "ax": 240, "ay": 637}, "heavy": {"w": 591, "h": 636, "ax": 190, "ay": 635}, "grab": {"w": 388, "h": 646, "ax": 60, "ay": 645}, "hit": {"w": 481, "h": 636, "ax": 245, "ay": 635}, "down": {"w": 648, "h": 275, "ax": 328, "ay": 274}, "win": {"w": 388, "h": 639, "ax": 134, "ay": 638}}, stage:'belair', stageName:'Bel-Air', taunt:'“Yo, you just got served, homie.”', blazin:'PHILLY SPECIAL', kind:'whip', cut:'video/philly_cut.mp4', win:'video/philly_win.mp4', labels:['JAB','KICK','KNEE'], heavyName:'high kick', spd:1.12, pow:0.9, col:'#c6f000' }
}
const IDS = Object.keys(ROSTER), STAGES = { alley:A('sprites/stage_alley.webp'), lot:A('sprites/stage_lot.webp'), belair:A('sprites/stage_belair.webp') }
for (const R of Object.values(ROSTER)) { R.cut = A(R.cut); R.win = A(R.win) }
const W = 960, H = 540, FLOOR0 = 404, FLOOR1 = 512, XMIN = 70, XMAX = 890
const cv = document.getElementById('cv'), ctx = cv.getContext('2d')
const coarse = matchMedia('(pointer:coarse)').matches
document.documentElement.classList.toggle('coarse', coarse)
function orient(){ document.documentElement.classList.toggle('landscape', coarse && innerWidth > innerHeight); fit() }
let DPR = 1; const VIEW = { k:1, ox:0, oy:0 }
function fit(){ const r = cv.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(r.width * DPR); cv.height = Math.round(r.height * DPR) }
addEventListener('resize', orient); orient()

/* ---------- assets ---------- */
const IMG = { stage:{} }, ALT = {}, WHITE = {}
const files = []
for (const [k, src] of Object.entries(STAGES)) files.push(['stage', k, src])
for (const id of IDS) { const R = ROSTER[id]; IMG[id] = {}; ALT[id] = {}; WHITE[id] = {}; for (const p of [...Object.keys(R.spr), 'portrait', 'front']) files.push([id, p, A(`sprites/${R.pre}_${p}.webp`)]) }
let loaded = 0, total = files.length, loadErr = ''
function tint(img){ const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; const x = c.getContext('2d'); x.drawImage(img,0,0); x.globalCompositeOperation='source-atop'; x.fillStyle='rgba(255,40,70,0.16)'; x.fillRect(0,0,c.width,c.height); return c }
function whiten(img){ const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; const x = c.getContext('2d'); x.drawImage(img,0,0); x.globalCompositeOperation='source-in'; x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); return c }
for (const [grp, k, src] of files) { const im = new Image(); im.onload = () => { loaded++; if (grp !== 'stage') { ALT[grp][k] = tint(im); if (ROSTER[grp].spr[k]) WHITE[grp][k] = whiten(im) } }; im.onerror = () => { loadErr = 'Could not load ' + src.split('?')[0].split('/').pop() + '. Refresh to try again.' }; im.src = src; IMG[grp][k] = im }
const art = (f, k) => (f.alt ? ALT : IMG)[f.ch][k]

/* ---------- audio (synthesized) ---------- */
let AC = null, muted = false, master = null, crowdBed = null
function audio(){ unlockVideo(); if (AC || muted) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination); bed() } catch { AC = null } }
function noiseBuf(sec){ const b = AC.createBuffer(1, AC.sampleRate * sec, AC.sampleRate), d = b.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1; return b }
let NB = null
function noise(dur, type, freq, q, vol, attack=0.002){ if (!AC || muted) return; NB = NB || noiseBuf(2); const s = AC.createBufferSource(); s.buffer = NB; const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; const g = AC.createGain(), t = AC.currentTime; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol, t+attack); g.gain.exponentialRampToValueAtTime(0.0001, t+dur); s.connect(f); f.connect(g); g.connect(master); s.start(t, Math.random()); s.stop(t+dur+0.05) }
function tone(f0, f1, dur, vol, type='sine'){ if (!AC || muted) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1, t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02) }
const SFX = {
  whoosh(){ noise(0.16,'bandpass',900,0.8,0.25,0.04) },
  punch(){ noise(0.09,'lowpass',1400,0.7,0.9); tone(140,60,0.12,0.6) },
  block(){ noise(0.07,'highpass',2500,0.5,0.35); tone(320,240,0.06,0.2,'square') },
  glass(){ noise(0.12,'lowpass',900,0.7,0.9); tone(110,45,0.2,0.7); noise(0.5,'highpass',4200,0.6,0.5); for (let i=0;i<5;i++) setTimeout(() => tone(3000+Math.random()*3000, 2500, 0.08, 0.08,'triangle'), 20+i*40) },
  slam(){ tone(90,35,0.4,0.9); noise(0.3,'lowpass',500,0.8,0.8) },
  gun(){ noise(0.04,'highpass',1200,0.4,1); noise(0.45,'lowpass',2200,0.5,0.9); tone(95,40,0.35,0.9) },
  crowd(big){ noise(big ? 1.6 : 0.9,'bandpass',750,0.6,big ? 0.5 : 0.28, 0.25) },
  bell(){ tone(880,860,0.9,0.25,'triangle'); tone(1320,1300,0.7,0.12,'sine') }
}
function bed(){ if (!AC) return; NB = NB || noiseBuf(2); const s = AC.createBufferSource(); s.buffer = NB; s.loop = true; const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=500; f.Q.value=0.5; const g = AC.createGain(); g.gain.value = 0.035; s.connect(f); f.connect(g); g.connect(master); s.start(); crowdBed = g }
document.getElementById('mute').onclick = e => { muted = !muted; e.target.textContent = muted ? 'Sound off' : 'Sound on'; if (master) master.gain.value = muted ? 0 : 0.7; if (!muted) audio() }

/* ---------- Blazin' cutscene video ---------- */
const CUT = document.getElementById('cut'), SKIP = document.getElementById('skip'); let cutOk = true, cutUnlocked = false
CUT.addEventListener('error', () => { if (CUT.getAttribute('src')) cutOk = false })
function unlockVideo(){ if (cutUnlocked) return; cutUnlocked = true; if (!CUT.getAttribute('src')) CUT.src = ROSTER.kenndogg.cut; try { CUT.muted = true; const p = CUT.play(); if (p) p.then(() => { CUT.pause(); CUT.currentTime = 0; CUT.muted = false }).catch(() => { CUT.muted = false }) } catch {} }
function playCut(src, done){
  if (!cutOk || !src) return done()
  if (!CUT.src.endsWith(src)) { CUT.src = src; CUT.load() }
  let fin = false; const end = () => { if (fin) return; fin = true; CUT.pause(); CUT.hidden = true; SKIP.hidden = true; done() }
  CUT.onended = end; SKIP.onclick = end; CUT.currentTime = 0; CUT.muted = muted; CUT.hidden = false; SKIP.hidden = false
  const p = CUT.play(); if (p) p.catch(() => { CUT.muted = true; CUT.play().catch(end) })
  setTimeout(() => { if (!fin && CUT.paused && CUT.currentTime === 0) end() }, 2500)
}
/* ---------- input ---------- */
const keys = {}, edge = {}
const KEYMAP = { ArrowLeft:'left', a:'left', A:'left', ArrowRight:'right', d:'right', D:'right', ArrowUp:'up', w:'up', W:'up', ArrowDown:'down', s:'down', S:'down', j:'light', J:'light', k:'heavy', K:'heavy', l:'grab', L:'grab', ' ':'block', u:'blazin', U:'blazin', Enter:'start', p:'pause', P:'pause', Escape:'pause' }
addEventListener('keydown', e => { const k = KEYMAP[e.key]; if (!k) return; e.preventDefault(); audio(); if (!keys[k]) edge[k] = true; keys[k] = true })
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false })
const stick = { x:0, y:0, id:null }
const stEl = document.getElementById('stick'), knob = document.getElementById('knob')
stEl.addEventListener('pointerdown', e => { audio(); stick.id = e.pointerId; stEl.setPointerCapture(e.pointerId); moveStick(e) })
stEl.addEventListener('pointermove', e => { if (e.pointerId === stick.id) moveStick(e) })
const endStick = e => { if (e.pointerId !== stick.id) return; stick.id = null; stick.x = stick.y = 0; knob.style.transform = '' }
stEl.addEventListener('pointerup', endStick); stEl.addEventListener('pointercancel', endStick)
function moveStick(e){ const r = stEl.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2, R = r.width/2 - 14; let dx = e.clientX - cx, dy = e.clientY - cy; const m = Math.hypot(dx,dy); if (m > R) { dx *= R/m; dy *= R/m } knob.style.transform = `translate(${dx}px,${dy}px)`; stick.x = dx/R; stick.y = dy/R }
for (const [id, k] of [['b-light','light'],['b-heavy','heavy'],['b-grab','grab'],['b-block','block'],['b-blazin','blazin']]) {
  const b = document.getElementById(id)
  b.addEventListener('pointerdown', e => { e.preventDefault(); audio(); b.classList.add('down'); if (!keys[k]) edge[k] = true; keys[k] = true; if (game.scene !== 'fight') edge.start = true })
  const up = () => { b.classList.remove('down'); keys[k] = false }
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up)
}
cv.addEventListener('pointerdown', e => { audio(); tapAt(e) })
const take = k => { const v = edge[k]; edge[k] = false; return v }

/* ---------- fighters ---------- */
const zY = z => FLOOR0 + z * (FLOOR1 - FLOOR0), zS = z => 0.86 + z * 0.22
class Fighter {
  constructor(ch, alt, x, face){ this.wins = 0; this.pick(ch, alt); this.reset(x, face) }
  pick(ch, alt){ this.ch = ch; this.R = ROSTER[ch]; this.alt = alt; this.name = this.R.name + (alt ? ' (RED)' : '') }
  reset(x, face){ Object.assign(this, { x, z:0.5, face, vx:0, vz:0, hp:100, hpLag:100, meter:0, state:'idle', t:0, combo:0, hitDone:false, inv:0, walkT:0, lift:0, rot:0, flash:0, queued:false }) }
  set(s){ this.state = s; this.t = 0; this.hitDone = false; this.rot = 0; this.lift = 0 }
  get busy(){ return !['idle','walk','block'].includes(this.state) }
  get canHit(){ return !['down','getup','ko','thrown','blazinD','win'].includes(this.state) && this.inv <= 0 }
}
const P = new Fighter('kenndogg', false, 300, 1), C = new Fighter('mabel', false, 660, -1)
const DIFF = { easy:{ react:520, block:0.15, aggr:0.45, grab:0.12 }, normal:{ react:330, block:0.35, aggr:0.65, grab:0.2 }, hard:{ react:190, block:0.6, aggr:0.85, grab:0.28 } }
const game = { scene:'title', diff:'normal', round:1, timer:60, hitstop:0, shake:0, slow:1, msg:'', msgT:0, sub:'', parts:[], cine:null, endT:0, winner:null, paused:false, menuSel:1, pick:0, blink:0, ai:{ next:0, hold:0, plan:null } }

/* ---------- combat ---------- */
const MOVES = {
  light:{ dur:330, a0:80, a1:170, reach:150, dmg:5, meter:13, stun:260, kb:150 },
  heavy:{ dur:720, a0:320, a1:440, reach:160, dmg:13, meter:24, stun:380, kb:420 },
  grab:{ dur:520, a0:110, a1:210, reach:135 }
}
function attack(a, d, kind){
  const m = MOVES[kind]; const dx = (d.x - a.x) * a.face, dz = Math.abs(d.z - a.z)
  if (dx < -12 || dx > m.reach || dz > 0.16 || !d.canHit) return false
  if (kind === 'grab') {
    if (['light','heavy'].includes(d.state) && d.t > MOVES[d.state].a0) return false
    a.set('throw'); d.set('thrown'); d.face = -a.face; d.vx = d.vz = 0; a.meter = Math.min(100, a.meter + 26); SFX.whoosh(); return true
  }
  const blocked = d.state === 'block' && Math.sign(a.x - d.x) === d.face
  if (blocked) {
    const chip = kind === 'heavy' ? 3 : 0; damage(d, chip, a); a.meter = Math.min(100, a.meter + 4); d.meter = Math.min(100, d.meter + 5); d.vx = a.face * (kind === 'heavy' ? 260 : 120); d.t = 0; d.flash = 80
    SFX.block(); burst(d, '#9fd8ff', 6); game.hitstop = 50; return true
  }
  const third = kind === 'light' && a.combo >= 2
  damage(d, Math.round((m.dmg + (third ? 3 : 0)) * a.R.pow), a); a.meter = Math.min(100, a.meter + m.meter); d.meter = Math.min(100, d.meter + 7)
  d.face = -a.face
  if (kind === 'heavy' || third) { d.set('down'); d.vx = a.face * m.kb * (third ? 0.8 : 1); d.lift = 0; game.shake = kind === 'heavy' ? 14 : 8; if (kind === 'heavy') { if (a.R.kind === 'whip') { SFX.punch(); SFX.slam() } else { SFX.glass(); shards(d) } SFX.crowd(true) } else SFX.punch() }
  else { d.set('hit'); d.vx = a.face * m.kb; SFX.punch() }
  game.hitstop = kind === 'heavy' ? 110 : 60; burst(d, kind === 'heavy' ? '#ffcc33' : '#ffffff', kind === 'heavy' ? 14 : 8)
  return true
}
function damage(d, n, from){ if (n <= 0) return; d.hp = Math.max(0, d.hp - n); d.flash = 90; if (d.hp <= 0) ko(d, from) }
function ko(d, from){ if (game.scene !== 'fight') return; d.set('ko'); d.vx = from.face * 380; game.scene = 'koslow'; game.endT = 0; game.slow = 0.25; game.winner = from; SFX.crowd(true); setMsg('K.O.!', '', 2200) }
function burst(f, col, n){ const y = zY(f.z) - 200 * zS(f.z); for (let i=0;i<n;i++) { const a = Math.random()*Math.PI*2, s = 120 + Math.random()*320; game.parts.push({ x:f.x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 60, life:0.35 + Math.random()*0.2, col, r:2 + Math.random()*3, type:'spark' }) } game.parts.push({ x:f.x, y, life:0.18, type:'ring', col, r:10 }) }

/* ---------- drawing ---------- */
function poseOf(f){

  if (s === 'light') return f.t > 50 && f.t < 260 ? 'light' : 'idle'
  if (s === 'heavy') return 'heavy'
  if (s === 'grab') return f.t > 40 ? 'grab' : 'idle'
  if (s === 'throw') return 'grab'
  if (s === 'hit' || s === 'thrown' || s === 'blazinD') return game.cine && !game.cine.fired && s === 'blazinD' ? 'idle' : 'hit'
  if (s === 'down' || s === 'ko') return (s === 'down' && f.t < 90) || (s === 'ko' && f.t < 90) ? 'hit' : 'down'
  if (s === 'getup') return 'idle'
  if (s === 'win') return 'win'
  if (s === 'blazinA') return game.cine && game.cine.t > 380 ? (f.R.spr.gun ? 'gun' : 'heavy') : 'idle'
  return 'idle'
}
function drawFighter(f, now){
